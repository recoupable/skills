name: Workspace sync candidate

on:
  push:
    branches: ['codex/sync-*']

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate proposed files
        run: |
          python3 scripts/portability_lint.py
          python3 scripts/check_vendored.py
          python3 scripts/validate_manifests.py
          python3 scripts/check_resolvable.py
          python3 scripts/run_resolver_eval.py
          node --test tests/consulting-brand.test.mjs tests/consulting-runtime.test.mjs
          python3 -m unittest discover -s tests -p test_consulting_templates.py

