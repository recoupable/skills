<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Recoup Sky overlay</title>
<!-- Stage brand/materialize.mjs beside the final composition. For standalone source preview,
     change this link to ../../../../brand/brand.css; output files use their staged local package. -->
<link rel="stylesheet" href="recoup-brand/brand.css"><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent}.stage{position:relative;width:1920px;height:1080px;overflow:hidden}
.card[data-card-id="recoup-sky"] .root{position:absolute;left:100px;right:100px;bottom:92px;padding:36px 44px;display:flex;gap:36px;align-items:center;background:var(--recoup-forest);color:white;border-radius:18px;font-family:var(--brand-body-font),sans-serif}
.card[data-card-id="recoup-sky"] img{width:168px;height:auto;margin-right:28px}
.card[data-card-id="recoup-sky"] .label{font:400 20px var(--brand-label-font),monospace;letter-spacing:.08em;color:var(--recoup-lime);text-transform:uppercase}
.card[data-card-id="recoup-sky"] .title{font-size:48px;line-height:1.1;font-weight:500;margin:12px 0 0;letter-spacing:-.02em}
.card[data-card-id="recoup-sky"] .detail{font-size:28px;line-height:1.4;margin:12px 0 0;font-weight:400}
</style></head><body><div class="stage"><div class="card" data-card-id="recoup-sky">
<div class="root" data-anim="fade-in" data-anim-at="0.1" data-anim-duration="0.5">
<img src="recoup-brand/logos/lockup-white.svg" alt="Recoup"><div><div class="label">The working note</div>
<h1 class="title">A clear next step</h1><p class="detail">Bring the right source to the decision.</p></div>
</div></div></div></body></html>
